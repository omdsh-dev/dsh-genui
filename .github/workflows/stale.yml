name: Close inactive issues

on:
  schedule:
    # Run daily at 02:17 UTC.
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: read

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure issue labels exist
        uses: actions/github-script@v9
        with:
          script: |
            const labels = [
              {
                name: "Stale",
                color: "ededed",
                description: "Issue inactive for 14 days.",
              },
              {
                name: "keep-open",
                color: "0e8a16",
                description: "Exclude this issue from automatic closure.",
              },
            ];

            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({
                  ...context.repo,
                  name: label.name,
                });
              } catch (error) {
                if (error.status !== 404) throw error;

                await github.rest.issues.createLabel({
                  ...context.repo,
                  ...label,
                });
              }
            }

      - name: Close inactive issues
        uses: actions/stale@v11
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-issue-stale: 14
          days-before-issue-close: 0
          days-before-pr-stale: -1
          days-before-pr-close: -1
          remove-pr-stale-when-updated: false
          stale-issue-label: Stale
          stale-issue-message: ""
          close-issue-message: >-
            此 Issue 已连续 14 天没有活动，现由 github-actions[bot] 自动关闭。
            如果问题仍然存在，请补充最新信息后重新打开。
          close-issue-reason: not_planned
          exempt-issue-labels: keep-open
          operations-per-run: 100
