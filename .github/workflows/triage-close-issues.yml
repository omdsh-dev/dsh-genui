name: triage-close-issues

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: triage-close-issues
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Close inactive issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/close-inactive-issues.mjs
