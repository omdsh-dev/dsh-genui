<!doctype html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Issue 382 browser regression: table.wrap</title>
    <style>
      body { margin: 24px; font-family: Arial, sans-serif; }
      .case { border: 1px solid #bbb; padding: 12px; margin-bottom: 12px; box-sizing: border-box; }
      .case > header { font-size: 11px; color: #555; margin-bottom: 6px; }
      #results { display: none; }
    </style>
  </head>
  <body>
    <h1>Issue 382: <code>table.wrap</code> layout</h1>
    <div id="root"></div>
    <pre id="results">pending</pre>
    <pre id="browser-errors"></pre>
    <script>
      const browserErrors = document.getElementById('browser-errors')

      /** 记录浏览器异常，方便从 CI 产物中查看页面错误。 */
      function recordBrowserError(message) {
        browserErrors.textContent += `${message}\n`
      }

      window.addEventListener('error', event => {
        recordBrowserError(`error: ${event.message} (${event.filename}:${event.lineno}:${event.colno})`)
      })
      window.addEventListener('unhandledrejection', event => {
        recordBrowserError(`unhandledrejection: ${String(event.reason)}`)
      })

      const originalConsoleError = console.error.bind(console)
      console.error = (...values) => {
        recordBrowserError(`console.error: ${values.map(String).join(' ')}`)
        originalConsoleError(...values)
      }
    </script>
    <script type="module" src="/tests/browser/table-wrap.tsx"></script>
  </body>
</html>
